<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spotify Login Confirmation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>
</head>
<body>
    <!-- Check box for confirmation -->
    <div id="card-container" class="d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div id="card-confirm" class="card" style="width:300px;">
            <div id="result-logo" class="mx-auto" style="margin-top: 20px;">
                <svg th:if="${authTokenSuccess}" xmlns="http://www.w3.org/2000/svg" width="150px" height="150px" fill="green" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                </svg>
                <svg th:unless="${authTokenSuccess}" xmlns="http://www.w3.org/2000/svg" width="150px" height="150px" fill="red" class="bi bi-x-circle-fill" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"></path>
                </svg>    
            </div>
            <div class="card-body">
                <h5 th:if="${authTokenSuccess}" class="card-title">Login Successful!</h5>
                <h5 th:unless="${authTokenSuccess}"class="card-title">Login Failed</h5>
                <p th:if="${authTokenSuccess}" class="card-text">You may now return to MB's Music Hub!</p>
                <p th:unless="${authTokenSuccess}" class="card-text">Error authenticating. Please try again. If problem persists, please contact the administrator</p>
                <!-- For right now, send to token display page -->
                <a th:if="${authTokenSuccess}" href="#" th:href="${redirectUrl}" class="btn btn-primary">Return to Music Hub</a>
                <a th:unless="${authTokenSuccess}" href="#" class="btn btn-primary">Return to Music Hub</a>                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
